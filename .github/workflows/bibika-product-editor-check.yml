name: Bibika product editor check

on:
  push:
    branches: [bibika-admin-v1]
    paths:
      - .github/workflows/bibika-product-editor-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bibika-admin-v1
      - name: Check product editor JavaScript
        run: |
          node --check bibika/product-editor.js
          grep -q 'product-editor.js' bibika/product.html
          grep -q 'product-editor.css' bibika/product.html
          grep -q 'id="edit-product"' bibika/product-editor.js
