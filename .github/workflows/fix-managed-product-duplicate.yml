name: Fix managed product duplicate blocks

on:
  push:
    branches: [bibika-admin-v1]
    paths:
      - .github/workflows/fix-managed-product-duplicate.yml
      - .github/fix_duplicate_managed_products.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bibika-admin-v1
      - name: Patch files
        run: python .github/fix_duplicate_managed_products.py
      - name: Check JavaScript
        run: |
          node --check bibika/text-page-blocks.js
          node --check bibika/managed-product-page.js
      - name: Commit fix
        run: |
          git config user.name "kiananstudio"
          git config user.email "konan1517@gmail.com"
          git add bibika/text-page-blocks.js bibika/_worker.js
          git commit -m "Prevent duplicate managed product blocks in Bibika" || true
          git push origin bibika-admin-v1
