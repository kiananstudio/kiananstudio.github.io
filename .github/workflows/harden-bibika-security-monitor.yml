name: Harden Bibika Security Monitor

on:
  push:
    branches: [bibika-admin-v1]
    paths:
      - .github/workflows/harden-bibika-security-monitor.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bibika-admin-v1

      - name: Reduce monitor attack surface and redact token-like path segments
        shell: python
        run: |
          from pathlib import Path

          p = Path('bibika/_worker.js')
          s = p.read_text()

          marker = '\nfunction isSuspiciousProbePath(value) {\n'
          safe_path = '''\nfunction safeSecurityPath(url) {\n  const pathname = String(url?.pathname || "/");\n  const parts = pathname.split("/").map(segment => {\n    let value = segment;\n    try { value = decodeURIComponent(segment); } catch {}\n    const compact = String(value || "").trim();\n    const tokenLike = compact.length >= 32 && (\n      /^[A-Fa-f0-9]{32,}$/.test(compact) ||\n      /^[A-Za-z0-9_-]{32,}$/.test(compact) ||\n      (compact.length >= 64 && compact.includes("."))\n    );\n    return tokenLike ? "[redacted]" : cleanSecurityText(segment, 80);\n  });\n  return parts.join("/").slice(0, 300) || "/";\n}\n'''
          if 'function safeSecurityPath(url)' not in s:
              if marker not in s:
                  raise SystemExit('safe path insertion marker not found')
              s = s.replace(marker, safe_path + marker, 1)

          old = '    const path = cleanSecurityText(url.pathname || "/", 300) || "/";\n'
          new = '    const path = safeSecurityPath(url);\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('security path marker not found')

          old = '    const additions = `<script defer src="/image-editor.js?v=1"></script><script defer src="/image-cleanup.js?v=1"></script><script defer src="/text-page-files.js?v=1"></script><script defer src="/text-page-blocks.js?v=2"></script><script defer src="/publish-hotfix.js?v=1"></script>`;\n'
          new = '    const additions = (url.pathname === "/security.html" || url.pathname === "/security") ? "" : `<script defer src="/image-editor.js?v=1"></script><script defer src="/image-cleanup.js?v=1"></script><script defer src="/text-page-files.js?v=1"></script><script defer src="/text-page-blocks.js?v=2"></script><script defer src="/publish-hotfix.js?v=1"></script>`;\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('security page injection marker not found')

          p.write_text(s)

          p = Path('bibika/security.html')
          s = p.read_text()
          s = s.replace(
              'Журнал не сохраняет пароли, Authorization-заголовки, cookies, токены, содержимое запросов и query-параметры URL. Сохраняются только технические метаданные, нужные для расследования: IP, география/ASN Cloudflare, путь без параметров, метод, тип события, причина блокировки, User-Agent, Ray ID и время.',
              'Журнал не сохраняет пароли, Authorization-заголовки, cookies, содержимое запросов и query-параметры URL. Похожие на токены длинные сегменты пути автоматически заменяются на [redacted]. Сохраняются только технические метаданные, нужные для расследования: IP, география/ASN Cloudflare, безопасно обработанный путь, метод, тип события, причина блокировки, User-Agent, Ray ID и время.'
          )
          p.write_text(s)

      - name: Check Worker
        run: |
          cp bibika/_worker.js /tmp/bibika-worker.mjs
          node --check /tmp/bibika-worker.mjs

      - name: Commit hardening
        run: |
          git config user.name "kiananstudio"
          git config user.email "konan1517@gmail.com"
          git add bibika/_worker.js bibika/security.html
          git commit -m "Harden Bibika Security Monitor data handling" || true
          git push origin bibika-admin-v1
